services:
  elnemer-1m-ai-librarian-hub:
    image: php:8.2-cli-alpine
    container_name: elnemer-1m-ai-librarian-hub
    restart: unless-stopped
    ports:
      - "${PORT:-8081}:8080"
    environment:
      - ELNEMER_UPSTREAM_API=${ELNEMER_UPSTREAM_API:-https://million.elnemer-ai.com}
    command: >
      sh -c "mkdir -p /srv/app &&
      wget -q -O /srv/app/index.php https://raw.githubusercontent.com/ElNeMeR70/elnemer-1m-ai-librarian-hub/main/app/index.php &&
      php -S 0.0.0.0:8080 -t /srv/app"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/?health=1"]
      interval: 30s
      timeout: 5s
      retries: 3
